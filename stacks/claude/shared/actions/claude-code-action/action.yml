name: "Claude Code Action"
description: "Run Claude Code in GitHub Actions workflows"

inputs:
  anthropic_api_key:
    description: "Anthropic API key"
    required: false
  claude_code_oauth_token:
    description: "Claude Code OAuth Token for Claude Pro"
    required: false
  github_token:
    description: "GitHub token for Claude to operate with"
    required: false
    default: ${{ github.token }}
  trigger_phrase:
    description: "The trigger phrase to look for in comments, issue/PR bodies, and issue titles"
    required: false
    default: "@claude"
  assignee_trigger:
    description: "The assignee username that triggers the action (e.g. @claude). Only used for issue assignment"
    required: false
  max_turns:
    description: "Maximum number of conversation turns Claude can take"
    required: false
  timeout_minutes:
    description: "Timeout in minutes for execution"
    required: false
    default: "30"
  model:
    description: "Model to use (provider-specific format required for Bedrock/Vertex)"
    required: false
  use_bedrock:
    description: "Use Amazon Bedrock with OIDC authentication instead of direct Anthropic API"
    required: false
    default: "false"
  use_vertex:
    description: "Use Google Vertex AI with OIDC authentication instead of direct Anthropic API"
    required: false
    default: "false"
  allowed_tools:
    description: "Additional tools for Claude to use (the base GitHub tools will always be included)"
    required: false
    default: ""
  disallowed_tools:
    description: "Tools that Claude should never use"
    required: false
    default: ""
  custom_instructions:
    description: "Additional custom instructions to include in the prompt for Claude"
    required: false
    default: ""
  mcp_config:
    description: "Additional MCP configuration (JSON string) that merges with the built-in GitHub MCP servers"
    required: false
    default: ""
  claude_env:
    description: "Custom environment variables to pass to Claude Code execution (YAML format)"
    required: false
    default: ""
  direct_prompt:
    description: "Direct prompt for Claude to execute automatically without needing a trigger (for automated workflows)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Install Claude Code
      shell: bash
      run: |
        set -euo pipefail
        npm install -g @anthropic-ai/claude-code@latest
        INSTALLED=$(claude --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        export INSTALLED
        node -e "
          const installed = process.env.INSTALLED;
          const min = '2.1.280';
          const parts = (v) => v.split('.').map(Number);
          const gte = (a, b) => {
            const A = parts(a); const B = parts(b);
            for (let i = 0; i < 3; i++) {
              if (A[i] > B[i]) return true;
              if (A[i] < B[i]) return false;
            }
            return true;
          };
          if (!installed || !gte(installed, min)) {
            console.error('Claude Code ' + installed + ' is below minimum ' + min);
            process.exit(1);
          }
        "

    - name: Install GitHub MCP Server
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        claude mcp add-json github '{
          "command": "docker",
          "args": [
            "run",
            "-i",
            "--rm",
            "-e",
            "GITHUB_PERSONAL_ACCESS_TOKEN",
            "ghcr.io/github/github-mcp-server:sha-ff3036d"
          ],
          "env": {
            "GITHUB_PERSONAL_ACCESS_TOKEN": "'"${INPUT_GITHUB_TOKEN}"'"
          }
        }'

    - name: Extract GitHub Context and Create Prompt
      shell: bash
      id: prepare_context
      env:
        # Pass user-controlled inputs via environment variables to prevent script injection (GHSL-2025-093)
        EVENT_COMMENT_BODY: ${{ github.event.comment.body }}
        EVENT_ISSUE_TITLE: ${{ github.event.issue.title }}
        EVENT_ISSUE_BODY: ${{ github.event.issue.body }}
        EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_REVIEW_BODY: ${{ github.event.review.body }}
        EVENT_ASSIGNEE_LOGIN: ${{ github.event.assignee.login }}
        INPUT_TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        INPUT_ASSIGNEE_TRIGGER: ${{ inputs.assignee_trigger }}
        INPUT_DIRECT_PROMPT: ${{ inputs.direct_prompt }}
        EVENT_ACTION: ${{ github.event.action }}
        EVENT_NAME: ${{ github.event_name }}
        REPO_NAME: ${{ github.repository }}
      run: |
        echo "🔍 Extracting GitHub context from event: $EVENT_NAME"
        
        # Function to check for trigger phrase
        check_trigger() {
          local text="$1"
          local trigger="$INPUT_TRIGGER_PHRASE"
          if [[ "$text" == *"$trigger"* ]]; then
            return 0
          fi
          return 1
        }
        
        # Extract context based on event type
        TRIGGER_FOUND="false"
        USER_REQUEST=""
        CONTEXT_INFO=""
        
        case "$EVENT_NAME" in
          "issue_comment")
            COMMENT_BODY="$EVENT_COMMENT_BODY"
            ISSUE_TITLE="$EVENT_ISSUE_TITLE"
            ISSUE_NUMBER="$EVENT_ISSUE_NUMBER"
            
            if check_trigger "$COMMENT_BODY"; then
              TRIGGER_FOUND="true"
              USER_REQUEST="$COMMENT_BODY"
              CONTEXT_INFO="Issue Comment on #$ISSUE_NUMBER: $ISSUE_TITLE"
            fi
            ;;
            
          "pull_request_review_comment")
            COMMENT_BODY="$EVENT_COMMENT_BODY"
            PR_TITLE="$EVENT_PR_TITLE"
            PR_NUMBER="$EVENT_PR_NUMBER"
            
            if check_trigger "$COMMENT_BODY"; then
              TRIGGER_FOUND="true"
              USER_REQUEST="$COMMENT_BODY"
              CONTEXT_INFO="PR Comment on #$PR_NUMBER: $PR_TITLE"
            fi
            ;;
            
          "pull_request_review")
            REVIEW_BODY="$EVENT_REVIEW_BODY"
            PR_TITLE="$EVENT_PR_TITLE"
            PR_NUMBER="$EVENT_PR_NUMBER"
            
            if check_trigger "$REVIEW_BODY"; then
              TRIGGER_FOUND="true"
              USER_REQUEST="$REVIEW_BODY"
              CONTEXT_INFO="PR Review on #$PR_NUMBER: $PR_TITLE"
            fi
            ;;
            
          "issues")
            ISSUE_BODY="$EVENT_ISSUE_BODY"
            ISSUE_TITLE="$EVENT_ISSUE_TITLE"
            ISSUE_NUMBER="$EVENT_ISSUE_NUMBER"
            
            if check_trigger "$ISSUE_TITLE" || check_trigger "$ISSUE_BODY"; then
              TRIGGER_FOUND="true"
              USER_REQUEST="$ISSUE_BODY"
              CONTEXT_INFO="Issue #$ISSUE_NUMBER: $ISSUE_TITLE"
            elif [[ "$EVENT_ACTION" == "assigned" && -n "$INPUT_ASSIGNEE_TRIGGER" ]]; then
              ASSIGNEE="$EVENT_ASSIGNEE_LOGIN"
              if [[ "$ASSIGNEE" == "$INPUT_ASSIGNEE_TRIGGER" ]]; then
                TRIGGER_FOUND="true"
                USER_REQUEST="$ISSUE_BODY"
                CONTEXT_INFO="Issue #$ISSUE_NUMBER assigned to $ASSIGNEE: $ISSUE_TITLE"
              fi
            fi
            ;;
        esac
        
        # Check for direct prompt override
        if [[ -n "$INPUT_DIRECT_PROMPT" ]]; then
          TRIGGER_FOUND="true"
          USER_REQUEST="$INPUT_DIRECT_PROMPT"
          CONTEXT_INFO="Automated GitHub workflow"
        fi
        
        if [[ "$TRIGGER_FOUND" != "true" ]]; then
          echo "❌ No trigger phrase found or direct prompt provided. Exiting gracefully."
          echo "SKIP_EXECUTION=true" >> $GITHUB_ENV
          exit 0
        fi
        
        echo "✅ Trigger found! Context: $CONTEXT_INFO"
        
        # Create comprehensive prompt
        mkdir -p /tmp/claude-action
        cat > /tmp/claude-action/github-context-prompt.txt << EOF
        You are Claude Code, an AI assistant helping with GitHub workflows and code.
        
        Repository: $REPO_NAME
        Context: $CONTEXT_INFO
        Event: $EVENT_NAME
        
        User Request:
        $USER_REQUEST
        
        Please analyze the request and provide helpful assistance.

        If the request involves modifying files and gives no steps of its own:
        - Read the repository's AGENTS.md (or README) first and follow its architecture and routing rules.
        - Work on a new branch, keep the change minimal and backward-compatible.
        - Run the repository's test suite as documented in AGENTS.md / README and ensure no regressions.
        - Commit, push the branch and open a pull request with \`gh pr create\`.
        If the request gives its own steps (for example a read-only review), follow those instead.

        Respond naturally and helpfully to the user's request using the available tools.
        EOF
        
        echo "PROMPT_FILE=/tmp/claude-action/github-context-prompt.txt" >> $GITHUB_ENV
        echo "SKIP_EXECUTION=false" >> $GITHUB_ENV

    - name: Run Claude Code
      if: env.SKIP_EXECUTION != 'true'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_MAX_TURNS: ${{ inputs.max_turns }}
        INPUT_ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        INPUT_DISALLOWED_TOOLS: ${{ inputs.disallowed_tools }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        CLAUDE_CODE_SUBAGENT_MODEL: inherit
        ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5-5
        ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-5-5
      run: |
        echo "🚀 Running Claude Code with GitHub context..."
        
        # Build command arguments
        CMD_ARGS=("-p" "--verbose" "--output-format" "stream-json" "--dangerously-skip-permissions")
        
        if [[ -n "$INPUT_MODEL" ]]; then
          CMD_ARGS+=("--model" "$INPUT_MODEL")
          export ANTHROPIC_MODEL="$INPUT_MODEL"
        fi
        
        # Add max turns if specified
        if [[ -n "$INPUT_MAX_TURNS" ]]; then
          CMD_ARGS+=("--max-turns" "$INPUT_MAX_TURNS")
        fi
        
        # Add allowed tools (include GitHub tools by default)
        TOOLS="mcp__github__get_issue,mcp__github__get_issue_comments,mcp__github__update_issue,mcp__github__search_issues,mcp__github__list_issues,mcp__github__add_issue_comment,mcp__github__get_pull_request,mcp__github__get_pull_request_files,mcp__github__get_pull_request_reviews,mcp__github__get_pull_request_status,mcp__github__get_pull_request_comments,Read,Write,Edit,Bash"
        if [[ -n "$INPUT_ALLOWED_TOOLS" ]]; then
          TOOLS="$TOOLS,$INPUT_ALLOWED_TOOLS"
        fi
        # allowed_tools is usually one tool per line; `read` below only sees the
        # first line, so make the list comma-separated first.
        TOOLS=$(printf '%s' "$TOOLS" | tr '\n' ',' | sed 's/,,*/,/g; s/^,//; s/,$//')
        
        # Remove any explicitly disallowed tools from the effective allow-list so
        # the read-only contract is enforced deterministically (no reliance on CLI
        # precedence between --allowedTools and --disallowedTools).
        if [[ -n "$INPUT_DISALLOWED_TOOLS" ]]; then
          DISALLOWED_CSV=$(echo "$INPUT_DISALLOWED_TOOLS" | tr ',\n' '  ' | xargs)
          FILTERED=""
          IFS=',' read -ra TOOL_ARR <<< "$TOOLS"
          for tool in "${TOOL_ARR[@]}"; do
            tool=$(echo "$tool" | xargs)
            [[ -z "$tool" ]] && continue
            skip="false"
            for bad in $DISALLOWED_CSV; do
              if [[ "$tool" == "$bad" ]]; then
                skip="true"
                break
              fi
            done
            if [[ "$skip" == "false" ]]; then
              FILTERED="${FILTERED:+$FILTERED,}$tool"
            fi
          done
          TOOLS="$FILTERED"
        fi
        CMD_ARGS+=("--allowedTools" "$TOOLS")
        
        # Add disallowed tools
        if [[ -n "$INPUT_DISALLOWED_TOOLS" ]]; then
          DISALLOWED_FLAG=$(echo "$INPUT_DISALLOWED_TOOLS" | tr '\n' ',' | sed 's/,*$//')
          CMD_ARGS+=("--disallowedTools" "$DISALLOWED_FLAG")
        fi
        
        echo "📝 Executing Claude Code with prompt from file..."
        
        # Execute Claude Code with timeout, using stdin for the prompt
        TIMEOUT_SECONDS=$(($INPUT_TIMEOUT_MINUTES * 60))
        timeout $TIMEOUT_SECONDS claude "${CMD_ARGS[@]}" < "$PROMPT_FILE" \
          | tee "$GITHUB_WORKSPACE/.claude-assess-output.jsonl"
        
        echo "✅ Claude Code execution completed" 