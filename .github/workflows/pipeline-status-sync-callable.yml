name: Pipeline Status Sync (callable)

on:
  workflow_call:
    inputs:
      hub_ref:
        type: string
        default: v1.1.0
      max_prs:
        type: string
        default: '30'

permissions:
  pull-requests: read
  issues: write
  actions: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: MervinPraison/github-automation-template/.github/actions/hub-setup@${{ inputs.hub_ref }}
        with:
          hub_ref: ${{ inputs.hub_ref }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Sync pipeline labels on open PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const path = require('path');
            const ps = require(path.join(process.env.HUB_SCRIPTS, 'pipeline-status.js'));
            await ps.syncOpenPullRequests(
              github, context.repo.owner, context.repo.repo,
              { maxPrs: parseInt('${{ inputs.max_prs }}', 10), dispatchMergeGate: true }, core
            );
